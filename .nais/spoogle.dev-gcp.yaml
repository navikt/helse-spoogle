spec:
  ingresses:
    - https://spoogle.intern.dev.nav.no
    - https://spoogle.ansatt.dev.nav.no
  replicas:
    max: 1
  kafka:
    pool: nav-dev
  azure:
    application:
      tenant: trygdeetaten.no
      claims:
        groups:
          - id: "9046ac9d-bb00-47dc-bcfb-e5221bf8d7f9" # tbd-dev
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        diskAutoresize: true
        tier: db-f1-micro
        name: spoogle
        flags:
          - name: cloudsql.logical_decoding
            value: "off"
          - name: cloudsql.enable_pglogical
            value: "off"
          - name: cloudsql.enable_pgaudit
            value: "true"
          - name: pgaudit.log
            value: "write"
        databases:
          - name: spoogle
            envVarPrefix: DATABASE
            users:
              - name: spoogle-opprydding-dev
  env:
    - name: KAFKA_CONSUMER_GROUP_ID
      value: tbd-spoogle-v1
    - name: AZURE_VALID_GROUP_IDS
      value: 9046ac9d-bb00-47dc-bcfb-e5221bf8d7f9 # tbd-dev
