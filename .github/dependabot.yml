version: 2
registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.READER_TOKEN }}
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "daily"
    commit-message:
      prefix: "⬆️ "
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "dependencies"
    patterns: ["*"]
    cooldown:
      default-days: 7
      exclude:
        - "navikt/sykepenger-github-workflows*"

  - package-ecosystem: "gradle"
    directory: "/"
    multi-ecosystem-group: "dependencies"
    patterns: ["*"]
    cooldown:
      default-days: 7
      exclude:
        - "no.nav.sykepenger.*"
        - "com.github.navikt.tbd-libs:*"

  - package-ecosystem: "npm"
    directory: "/spoogle-frontend"
    multi-ecosystem-group: "dependencies"
    patterns: ["*"]
    registries: "*"
    cooldown:
      default-days: 7
    ignore:
      # typescript-eslint støtter ikke TS >= 6.1 ennå, se https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        versions: [">= 6.1.0"]
