name: main - spoogle-backend - Bygg, test og deploy

# Avviker fra sykepenger-standarden ved at bygg, test og image ikke bruker de gjenbrukbare workflowene:
# frontenden må bygges med pnpm først, og det skjer i samme jobb som Gradle-bygget.

on:
  push:
    branches:
      - main
    paths:
      # Generelt oppsett - alt unntatt dokumentasjon / urelatert oppsett
      - '**'
      - '!**.md'
      - '!CODEOWNERS'
      - '!LICENSE'
      - '!docs/**'
      - '!.nais/**'
      - '!.github/workflows/standard-dependabot-auto-merge.yml'
      - '!.github/workflows/standard-dependency-submission.yml'
      # Ressursene som deployes av denne workflowen
      - '.nais/spoogle.yaml'
      - '.nais/spoogle.*.yaml'
      # Spesielt for denne tjenesten ellers
      - '!.github/workflows/pr.yml'
      - '!.github/workflows/main-opprydding-dev.yml'
      - '!spoogle-opprydding-dev/**'
  schedule:
    - cron: '0 4 * * 3'
      timezone: 'Europe/Oslo'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read # for sarif
  contents: read
  security-events: write # push sarif to github security
  id-token: write # for nais login

jobs:
  bygg-image:
    name: Bygg, test, og publiser image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # for sarif upload on private repos
      contents: read
      id-token: write # for nais login
      security-events: write # push sarif to github security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: spoogle-frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: spoogle-frontend/package.json
          cache: pnpm
          cache-dependency-path: spoogle-frontend/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: "@navikt"

      - name: pnpm install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
        working-directory: spoogle-frontend

      - name: pnpm run lint
        run: pnpm run lint
        working-directory: spoogle-frontend

      # Frontenden bygges kun her, og pakkes inn i imaget som statiske ressurser.
      - name: pnpm run build
        run: pnpm run build
        working-directory: spoogle-frontend

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: NAIS login
        id: login
        uses: nais/login@40b72a35a18ddf2ad74b632461139ab838cc2a2f # v0
        with:
          team: tbd

      - name: gradlew clean build :spoogle-backend:jib
        id: jib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ${{ steps.login.outputs.registry }}
        run: |
          ./gradlew clean build :spoogle-backend:jib --build-cache \
            -Pimage.registry="$REGISTRY" \
            -Pimage.tag=$(date -u +%Y.%m.%d-%H.%M)-$(git rev-parse --short=12 HEAD) \
            -Djib.console=plain
          ref="$(cat spoogle-backend/build/jib-image.name)@$(cat spoogle-backend/build/jib-image.digest)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Generer SBOM, attester og signer
        uses: nais/attest-sign@c02a0aedb111660e9fcf79e505753d6a7af4dcd5 # v2.1.0
        with:
          image_ref: ${{ steps.jib.outputs.ref }}

      - name: Scan docker image for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.jib.outputs.ref }}
          format: 'sarif'
          scanners: 'secret'
          output: 'trivy.sarif'

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: 'trivy.sarif'
    outputs:
      image_ref: ${{ steps.jib.outputs.ref }}

  deploy-dev:
    name: Deploy til dev
    needs: bygg-image
    uses: navikt/sykepenger-github-workflows/.github/workflows/deploy-v2.yml@fc1bc4b862baacc4b4d8e0519bf3dc9040a2e644 # v1.0.11
    with:
      manifest: .nais/spoogle.yaml
      environment: dev-gcp
      image: ${{ needs.bygg-image.outputs.image_ref }}
    permissions:
      contents: read
      id-token: write # for nais login

  deploy-prod:
    name: Deploy til prod
    needs: bygg-image
    uses: navikt/sykepenger-github-workflows/.github/workflows/deploy-v2.yml@fc1bc4b862baacc4b4d8e0519bf3dc9040a2e644 # v1.0.11
    with:
      manifest: .nais/spoogle.yaml
      environment: prod-gcp
      image: ${{ needs.bygg-image.outputs.image_ref }}
    permissions:
      contents: read
      id-token: write # for nais login
