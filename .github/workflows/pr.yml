name: PR - Bygg og test alt

# Avviker fra sas-standarden (`standard-pr.yml`) ved at frontenden bygges med pnpm før Gradle-bygget.

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-pr${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # for nais login

jobs:
  bygg-og-test:
    name: Bygg og test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # for nais login
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: spoogle-frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: spoogle-frontend/package.json
          cache: pnpm
          cache-dependency-path: spoogle-frontend/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile
        working-directory: spoogle-frontend

      - name: pnpm run lint
        run: pnpm run lint
        working-directory: spoogle-frontend

      - name: pnpm run build
        run: pnpm run build
        working-directory: spoogle-frontend

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: NAIS login
        id: login
        uses: nais/login@bb6c3e1e14e53d40d69d0d092bd2fce2e39ae3bf # v0
        with:
          team: tbd

      - name: gradlew clean build jibDockerBuild
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew clean build jibDockerBuild -Djib.console=plain --build-cache

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high # Fail if introducing high or critical vulnerabilities
