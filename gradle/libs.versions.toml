[versions]
flyway = "13.0.0"
google-cloud-sql-socket-factory = "1.28.3"
hikari = "7.0.2"
kotlin = "2.4.10"
kotliquery = "1.9.1"
logback-syslog4j = "1.0.0"
mock-oauth2-server = "3.0.3"
postgresql = "42.7.11"
rapids-and-rivers = "2026051812441779101082"
sasGradlePlugins = "20260804.1151"
tbd-libs = "20260513.1819"
testcontainers-postgresql = "2.0.5"
token-validation-ktor = "6.0.7"

[libraries]
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
google-cloud-sql-socket-factory = { module = "com.google.cloud.sql:postgres-socket-factory", version.ref = "google-cloud-sql-socket-factory" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
kotliquery = { module = "com.github.seratch:kotliquery", version.ref = "kotliquery" }
ktor-client-apache-jvm = { module = "io.ktor:ktor-client-apache-jvm" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation" }
ktor-client-core-jvm = { module = "io.ktor:ktor-client-core-jvm" }
ktor-network-tls-certificates = { module = "io.ktor:ktor-network-tls-certificates" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth" }
ktor-server-auth-jwt = { module = "io.ktor:ktor-server-auth-jwt" }
ktor-server-call-id = { module = "io.ktor:ktor-server-call-id" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation" }
ktor-server-core-jvm = { module = "io.ktor:ktor-server-core-jvm" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors" }
ktor-server-forwarded-header = { module = "io.ktor:ktor-server-forwarded-header" }
ktor-server-metrics-micrometer = { module = "io.ktor:ktor-server-metrics-micrometer" }
ktor-server-netty-jvm = { module = "io.ktor:ktor-server-netty-jvm" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host" }
jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
logback-syslog4j = { module = "com.papertrailapp:logback-syslog4j", version.ref = "logback-syslog4j" }
mock-oauth2-server = { module = "no.nav.security:mock-oauth2-server", version.ref = "mock-oauth2-server" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
rapids-and-rivers = { module = "com.github.navikt:rapids-and-rivers", version.ref = "rapids-and-rivers" }
tbd-libs-test = { module = "com.github.navikt.tbd-libs:rapids-and-rivers-test", version.ref = "tbd-libs" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers-postgresql" }
token-validation-ktor = { module = "no.nav.security:token-validation-ktor-v3", version.ref = "token-validation-ktor" }

[plugins]
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sas-deployable = { id = "no.nav.helse.sas.sas-deployable", version.ref = "sasGradlePlugins" }
sas-kotlin = { id = "no.nav.helse.sas.sas-kotlin", version.ref = "sasGradlePlugins" }
sas-root = { id = "no.nav.helse.sas.sas-root", version.ref = "sasGradlePlugins" }
